name: CI

on:
  push:
    paths: ['wordpress/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['wordpress/**', '.github/workflows/ci.yml']

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint
        run: |
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l > lint.txt 2>&1 || true
          if grep -q 'Parse error' lint.txt; then grep 'Parse error' lint.txt; exit 1; fi

  test:
    name: Integration + end-to-end
    runs-on: ubuntu-latest
    needs: lint
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: oywp_ci
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, gd, mbstring, intl
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright
        run: |
          npm install -g playwright@1.47
          npx playwright install --with-deps chromium
      - name: Run tests
        env:
          DB_NAME: oywp_ci
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          WP_DIR: ${{ runner.temp }}/wp
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: bash wordpress/dev/ci.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
